schema_version: 1

context:
  name: homeharvest
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/homeharvest-${{ version }}.tar.gz
  sha256: aed4e3de3c5daa3042f0e9c007828d3907bb37723180301e92a9239f967539a8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<3.13
    - pandas >=2.3.1,<3.0.0
    - pydantic >=2.11.7,<3.0.0
    - tenacity >=9.1.2,<10.0.0
    - httpx2 >=2.16.2,<3.0.0

tests:
  - python:
      imports:
        - homeharvest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Real estate scraping library supporting Zillow, Realtor.com & Redfin.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Bunsly/HomeHarvest

extra:
  recipe-maintainers:
    - thewchan
