schema_version: 1

context:
  name: homeharvest
  version: "2.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/homeharvest-${{ version }}.tar.gz
  sha256: efff3f568353fed67c47be09c89907326b25e57b8fa9cbb7b67f25e4410cefd3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<3.13
    - pandas >=2.3.1,<3.0.0
    - pydantic >=2.11.7,<3.0.0
    - requests >=2.32.4,<3.0.0
    - tenacity >=9.1.2,<10.0.0

tests:
  - python:
      imports:
        - homeharvest
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Real estate scraping library supporting Zillow, Realtor.com & Redfin.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Bunsly/HomeHarvest

extra:
  recipe-maintainers:
    - thewchan
